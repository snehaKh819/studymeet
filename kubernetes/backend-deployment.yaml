apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: studymeet-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres:5432/studymeet?schema=public"
        - name: LIVEKIT_URL
          value: "ws://livekit:7880"
        - name: LIVEKIT_API_KEY
          value: "devkey"
        - name: LIVEKIT_API_SECRET
          value: "devsecret"
        - name: JWT_SECRET
          value: "dev_jwt_secret"
        - name: PORT
          value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 4000
    targetPort: 4000