events {}

http {

    upstream auth_service {
        server user-auth:5001;
    }

    upstream room_service {
        server room-service:5002;
    }

    upstream frontend_service {
        server frontend:3000;
    }

    upstream chat_service {
        server chat-service:3002;
    }

    upstream timer_service {
        server timer-service:5003;
    }

    server {

        listen 80;

        # =========================
        # AUTH SERVICE
        # =========================

        location /api/auth/ {

            rewrite ^/api/auth/(.*) /$1 break;

            proxy_pass http://auth_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # =========================
        # ROOM SERVICE
        # =========================

        location /api/rooms/ {

            rewrite ^/api/rooms/(.*) /$1 break;

            proxy_pass http://room_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # =========================
        # CHAT SERVICE
        # =========================

        location /chat {

            proxy_pass http://chat_service;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }


        # =========================
        # TIMER SOCKET.IO
        # =========================

        location /socket.io/timer/ {

        proxy_pass http://timer_service/socket.io/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_cache_bypass $http_upgrade;
      }


        # =========================
        # LIVEKIT
        # =========================

        location /rtc/ {

            proxy_pass http://livekit:7800/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }


        # =========================
        # FRONTEND
        # =========================

        location / {

            proxy_pass http://frontend_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}