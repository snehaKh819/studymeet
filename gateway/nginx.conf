events {}

http {
  upstream auth_service {
    server user-auth:5001;
  }

  upstream room_service {
    server room-service:5002;
  }

  upstream frontend_service {
    server frontend:3000;
  }

  server {
    listen 80;

    location /api/auth/ {
      rewrite ^/api/auth/(.*) /$1 break;
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/me {
      rewrite ^/api/(.*) /$1 break; # Strips /api/ so your auth app handles /me cleanly
      proxy_pass http://auth_service; # Fixed the typo pointing to the correct upstream name
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/rooms {
      rewrite ^/api/rooms/?(.*) /$1 break; # Strips /api/rooms or /api/rooms/ before passing onwards
      proxy_pass http://room_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://frontend_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rtc/ {
      proxy_pass http://livekit:7800/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}