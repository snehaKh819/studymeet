services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      user-auth:
        condition: service_healthy
      frontend:
        condition: service_started
      livekit:
        condition: service_started
      room-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - studymeet-network
    restart: unless-stopped

  study_postgres:
    image: postgres:15-alpine
    container_name: study_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=studymeet_auth
    ports:
      - "5433:5432"
    networks:
      - studymeet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  user-auth:
    build: ./services/user-auth
    container_name: studymeet-user-auth-1
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://postgres:password@study_postgres:5432/studymeet_auth?schema=public
      - JWT_SECRET=9b1deb4d3b7d4f899a1d2e3f4g5h6i7j8k9l0
    depends_on:
      study_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - studymeet-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - studymeet-network
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.5
    container_name: studymeet-livekit
    command: --config /livekit.yaml
    volumes:
      - ./livekit.yaml:/livekit.yaml
    ports:
      - "7800:7800"
      - "7801:7801"
    networks:
      - studymeet-network
    restart: unless-stopped

  room-service:
    build: ./services/room-service
    container_name: studymeet-room-service
    environment:
      - PORT=5002
      - JWT_SECRET=9b1deb4d3b7d4f899a1d2e3f4g5h6i7j8k9l0
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecretkeythatisatleast32characterslong
    networks:
      - studymeet-network
    depends_on:
      - livekit
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - studymeet-network
    restart: unless-stopped

  chat-service:
    build: ./services/chat-service
    environment:
      - REDIS_HOST=redis
      - PORT=3002
      - JWT_SECRET=9b1deb4d3b7d4f899a1d2e3f4g5h6i7j8k9l0
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - studymeet-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  studymeet-network:
    driver: bridge
