version: '3.9'
services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-auth
      - frontend

  user-auth:
    build: ./services/user-auth
    env_file:
      - ./services/user-auth/.env
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
