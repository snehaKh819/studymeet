version: '3.9'
services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-auth
      - frontend

  user-auth:
    build: ./services/user-auth
    env_file:
      - ./services/user-auth/.env
    restart: on-failure

  user-service:
    build: ./user-service
    env_file: .env
    # depends_on:
    #   db:
    #     condition: service_healthy
    restart: on-failure

  # db:
  #   image: postgres:15-alpine
  #   env_file: .env
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
  #     interval: 5s
  #     retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

