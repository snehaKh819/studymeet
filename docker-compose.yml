services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      user-auth:
        condition: service_healthy
      frontend:
        condition: service_started
      livekit:
        condition: service_started
      room-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      whiteboard-service:
        condition: service_healthy
      timer-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
    networks:
      - studymeet-network
    restart: unless-stopped

  study_postgres:
    image: postgres:15-alpine
    container_name: study_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=studymeet_auth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - studymeet_postgres_data:/var/lib/postgresql/data
    networks:
      - studymeet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  user-auth:
    build: ./services/user-auth
    container_name: studymeet-user-auth-1
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@study_postgres:5432/studymeet_auth?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      study_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - studymeet-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - studymeet-network
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.5
    container_name: studymeet-livekit
    command: --config /livekit.yaml
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    ports:
      - "7800:7800"
      - "7801:7801"
    networks:
      - studymeet-network
    restart: unless-stopped

  room-service:
    build: ./services/room-service
    container_name: studymeet-room-service
    environment:
      - PORT=5002
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      - REDIS_HOST=redis
    networks:
      - studymeet-network
    depends_on:
      - livekit
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - studymeet-network
    restart: unless-stopped

  chat-service:
    build: ./services/chat-service
    environment:
      - REDIS_HOST=redis
      - PORT=3002
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - studymeet-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  whiteboard-service:
    build: ./services/whiteboard-service
    container_name: studymeet-whiteboard
    environment:
      - PORT=3003
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - studymeet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  timer-service:
    build: ./services/timer-service
    container_name: studymeet-timer-service

    environment:
      - PORT=5003
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}

    depends_on:
      - redis

    restart: unless-stopped

    networks:
      - studymeet-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  workspace-service:
    build: ./services/workspace-service
    container_name: studymeet-workspace-service
    environment:
      - PORT=5004
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@study_postgres:5432/studymeet_workspaces?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      - REDIS_HOST=redis
      - USER_AUTH_URL=http://user-auth:5001
      - EXECUTION_URL=http://execution-service:5005
    depends_on:
      study_postgres:
        condition: service_healthy
      user-auth:
        condition: service_healthy
      redis:
        condition: service_started
      execution-service:
        condition: service_started
    networks:
      - studymeet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  execution-service:
    build: ./services/execution-service
    container_name: studymeet-execution-service
    environment:
      - PORT=5005
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    volumes:
      # Lets this service start the throw-away sandbox containers.
      # NOTE: access to the Docker socket is powerful - see services/execution-service/README.md
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - studymeet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  studymeet_postgres_data:
    name: studymeet_postgres_data

networks:
  studymeet-network:
    driver: bridge
